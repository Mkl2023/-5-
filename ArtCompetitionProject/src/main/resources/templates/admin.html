<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">АртКонкурсы ИСС</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="/about">Об авторе</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/dashboard">Администратор</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Панель администратора</h4>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="border rounded p-3 bg-white">
                        <h5>Общее количество пользователей</h5>
                        <p class="fs-4 mb-0" th:text="${totalUsers}">145</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="border rounded p-3 bg-white">
                        <h5>Среднее время ожидания</h5>
                        <p class="fs-4 mb-0" th:text="${avgWaitTime}">24 часа</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
